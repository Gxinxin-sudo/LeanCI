
name: deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate deployment environment
        env:
          DEPLOY_ENV: ${{ vars.DEPLOY_ENVIRONMENT }}
        run: python scripts/validate_env.py
