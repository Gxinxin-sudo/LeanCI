[project]
name = "leanci-backend"
version = "0.1.0"
description = "LeanCI phase-one mock API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.7.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
